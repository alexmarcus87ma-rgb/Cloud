name: Claude Issue Handler

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

jobs:
  handle-claude-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --save-dev @anthropic-ai/sdk

      - name: Debug - Print event info
        run: |
          echo "=== GITHUB EVENT DEBUG ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Issue labels JSON: ${{ toJson(github.event.issue.labels) }}"
          echo "Comment body: ${{ github.event.comment.body }}"
          echo "========================="

      - name: Run Claude handler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/handlers/claude-issue-handler.js
